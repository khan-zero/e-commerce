{% extends 'core/base_dashboard.html' %}
{% load static %}

{% block title %}Shop Settings - Dashboard{% endblock %}
{% block page_title %}Shop Settings{% endblock page_title %}

{% block content %}
    <div class="dashboard-card">
        <div class="card-header">
            <h2>Manage Your Shop Profile</h2>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
{% endblock content %}
